name: CodeQL Security Analysis

# تحليل أمني ثابت (SAST) — معيار GitHub Advanced Security المستخدم في المستودعات الكبيرة.
# Kotlin عبر بناء فعلي داخل CI، والنتائج تظهر في تبويب Security → Code scanning.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # فحص أسبوعي: الاثنين 06:00 UTC — يكشف ثغرات جديدة في محلل CodeQL نفسه
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # مكتبات proot تلزم البناء (نفس خطوات build.yml)
    - name: Fetch proot (checksum-verified)
      run: bash scripts/fetch-proot.sh

    - name: Install npm dependencies
      run: npm --prefix scripts ci --ignore-scripts --prefer-offline --no-audit

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: kotlin

    - name: Build for CodeQL analysis
      run: ./gradlew assembleDebug --stacktrace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:kotlin"
