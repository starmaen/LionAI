name: Lion verify

on:
  push:
    branches: ["fix/web-context-and-claude-composer"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.lion.ai.WebToolBridge*" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
