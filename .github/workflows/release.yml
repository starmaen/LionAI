name: Release Lion AI

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LION_KEYSTORE_PASSWORD: ${{ secrets.LION_KEYSTORE_PASSWORD }}
      LION_KEY_PASSWORD: ${{ secrets.LION_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Restore signing key from secrets (if configured)
      if: github.event_name != 'pull_request'
      env:
        LION_KEYSTORE_BASE64: ${{ secrets.LION_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$LION_KEYSTORE_BASE64" ]; then
          mkdir -p keystore
          echo "$LION_KEYSTORE_BASE64" | base64 -d > keystore/lionai-release.jks
          echo "Signing key restored from secrets."
        else
          echo "::error::LION_KEYSTORE_BASE64 is not set; refusing to build a release with the wrong key."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Build signed release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Verify signing certificate fingerprint
      if: github.event_name != 'pull_request'
      env:
        EXPECTED_SHA256: ${{ vars.LION_CERT_SHA256 }}
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
        ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk \
          | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
        EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-Z' 'a-z')
        echo "Actual certificate SHA-256: $ACTUAL"
        if [ -z "$EXPECTED" ]; then
          echo "::error::LION_CERT_SHA256 is not set; refusing to publish without a fingerprint check."
          exit 1
        fi
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::Signing certificate changed! Users could not update over the installed app."
          exit 1
        fi
        echo "Certificate matches the expected fingerprint."

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
