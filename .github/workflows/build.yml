name: Build Lion AI APK

on:
  push:
    branches: [ main ]
  # الفروع تبقى بلا بناء حتى تُفتح لها Pull Request: بهذا يُبنى الفرع ويُختبر قبل الدمج
  # بدل أن يُبنى main فقط بعد فوات الأوان.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LION_KEYSTORE_PASSWORD: ${{ secrets.LION_KEYSTORE_PASSWORD }}
      LION_KEY_PASSWORD: ${{ secrets.LION_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Cache npm dependencies
      uses: actions/cache@v6
      with:
        path: |
          scripts/node_modules
          ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Cache Gradle wrapper
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/wrapper
        key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Fetch proot (Linux environment runtime, checksum-verified)
      run: bash scripts/fetch-proot.sh

    - name: Install npm dependencies
      run: npm --prefix scripts ci --ignore-scripts --prefer-offline --no-audit

    - name: Test browser session DOM bridge
      run: npm --prefix scripts test

    - name: Install Playwright Chromium (cached)
      run: npm exec --prefix scripts -- playwright install --with-deps chromium

    - name: Test real Chromium editor and reply round trips (local fixtures)
      run: npm --prefix scripts run test:browser

    # بوابة بيانات Lion-1: يمنع دمج بيانات تدريب قديمة أو صيغة أدوات مكسورة
    - name: Validate Lion-1 training data (tools catalog + JSONL format)
      run: |
        python model/data/import_tools.py --check
        python model/eval_lion.py data model/data/train.jsonl model/data/val.jsonl

    # تحليل ثابت يفشل على أي مخالفة جديدة (maxIssues: 0 في config/detekt/detekt.yml)
    - name: Static analysis (detekt)
      run: ./gradlew detekt --stacktrace

    - name: Run unit tests
      run: |
        set -o pipefail
        ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit-tests.log

    - name: Coverage report (Kover) + summary
      run: |
        ./gradlew koverXmlReport --stacktrace
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        r = ET.parse("app/build/reports/kover/report.xml").getroot()
        for c in r.iter("counter"):
            if c.get("type") == "LINE":
                m, cv = int(c.get("missed")), int(c.get("covered"))
                print(f"::notice::Line coverage: {cv / (m + cv) * 100:.1f}% ({cv}/{m + cv} lines)")
        PY

    - name: Report failing tests
      if: failure()
      run: |
        python3 - <<'PY'
        import glob
        import xml.etree.ElementTree as ET
        for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
            try:
                root = ET.parse(path).getroot()
            except Exception:
                continue
            for case in root.iter("testcase"):
                failure = case.find("failure")
                if failure is None:
                    continue
                message = (failure.get("message") or failure.text or "failed").replace("\n", " ")[:1200]
                print(f"::error file={path}::{case.get('classname')}.{case.get('name')}: {message}")
        PY
        grep -E "^(e: |.*error: )" /tmp/unit-tests.log | head -20 | while IFS= read -r line; do
          echo "::error::${line}"
        done

    - name: Build signed release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Show signing certificate (must be identical on every build)
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-256|Signer #1" || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LionAI-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload detekt and coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          build/reports/detekt/
          app/build/reports/kover/
        if-no-files-found: ignore
        retention-days: 14