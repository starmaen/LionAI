name: Build Lion AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Report failing tests
      if: failure()
      run: |
        python3 - <<'PY'
        import glob
        import xml.etree.ElementTree as ET
        for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
            try:
                root = ET.parse(path).getroot()
            except Exception:
                continue
            for case in root.iter("testcase"):
                failure = case.find("failure")
                if failure is None:
                    continue
                message = (failure.get("message") or failure.text or "failed").replace("\n", " ")[:1200]
                print(f"::error file={path}::{case.get('classname')}.{case.get('name')}: {message}")
        PY

    - name: Build signed release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Show signing certificate (must be identical on every build)
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-256|Signer #1" || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LionAI-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30
