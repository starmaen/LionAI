name: Build Lion AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # اختياري: عند إضافته في GitHub Secrets يُستخدم تلقائياً، وإلا تبقى القيمة القديمة
      # حتى لا ينكسر توقيع التحديثات.
      LION_KEYSTORE_PASSWORD: ${{ secrets.LION_KEYSTORE_PASSWORD }}
      LION_KEY_PASSWORD: ${{ secrets.LION_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install OpenCode (direct binary download)
      run: |
        set -euo pipefail
        echo "Installing OpenCode..."
        # Create bin directory
        mkdir -p $HOME/.opencode/bin
        # Download OpenCode binary directly
        curl -fsSL -o $HOME/.opencode/bin/opencode https://opencode.ai/releases/latest/opencode-linux-amd64
        chmod +x $HOME/.opencode/bin/opencode
        # Add to PATH for this job
        echo "$HOME/.opencode/bin" >> $GITHUB_PATH
        # Verify installation
        command -v opencode && opencode --version
        echo "OpenCode installed successfully"

    - name: Test browser session DOM bridge
      run: npm --prefix scripts ci --ignore-scripts && npm --prefix scripts test

    - name: Test real Chromium editor and reply round trips (local fixtures)
      run: |
        npm exec --prefix scripts -- playwright install --with-deps chromium
        npm --prefix scripts run test:browser

    - name: Run unit tests
      run: |
        set -o pipefail
        ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit-tests.log

    - name: Report failing tests
      if: failure()
      run: |
        python3 - <<'PY'
        import glob
        import xml.etree.ElementTree as ET
        for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
            try:
                root = ET.parse(path).getroot()
            except Exception:
                continue
            for case in root.iter("testcase"):
                failure = case.find("failure")
                if failure is None:
                    continue
                message = (failure.get("message") or failure.text or "failed").replace("\n", " ")[:1200]
                print(f"::error file={path}::{case.get('classname')}.{case.get('name')}: {message}")
        PY
        grep -E "^(e: |.*error: )" /tmp/unit-tests.log | head -20 | while IFS= read -r line; do
          echo "::error::${line}"
        done

    - name: Build signed release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Show signing certificate (must be identical on every build)
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-256|Signer #1" || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LionAI-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30