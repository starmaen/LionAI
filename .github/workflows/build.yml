name: Build Lion AI APK

on:
  push:
    branches: [ main ]
  # الفروع تبقى بلا بناء حتى تُفتح لها Pull Request: بهذا يُبنى الفرع ويُختبر قبل الدمج
  # بدل أن يُبنى main فقط بعد فوات الأوان.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# كل push جديد على الفرع نفسه يُلغي البناء القديم (الوكيل يدفع مرات متتالية).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LION_KEYSTORE_PASSWORD: ${{ secrets.LION_KEYSTORE_PASSWORD }}
      LION_KEY_PASSWORD: ${{ secrets.LION_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Restore signing key from secrets (if configured)
      if: github.event_name != 'pull_request'
      env:
        LION_KEYSTORE_BASE64: ${{ secrets.LION_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$LION_KEYSTORE_BASE64" ]; then
          mkdir -p keystore
          echo "$LION_KEYSTORE_BASE64" | base64 -d > keystore/lionai-release.jks
          echo "Signing key restored from secrets."
        else
          echo "::error::LION_KEYSTORE_BASE64 is not set; refusing to build a release with the wrong key."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: |
          scripts/node_modules
          ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Cache Gradle wrapper
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/wrapper
        key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # بوابة ترجمة سريعة: أخطاء Kotlin تظهر خلال دقائق قبل Playwright وproot.
    - name: Fast compile gate (Kotlin)
      run: ./gradlew :app:compileDebugKotlin --stacktrace

    # اختبارات Chromium الحقيقية بطيئة (تثبيت apt + تنزيل 1-8 دقائق): تعمل فقط عند تغيّر ملفاتها.
    - name: Detect browser-related changes
      id: web
      run: |
        run=true
        base=""
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base=$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || true)
        elif [ "${{ github.event_name }}" = "push" ]; then
          base="${{ github.event.before }}"
        fi
        if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
          if git diff --name-only "$base" HEAD | grep -qE '^(scripts/|app/src/main/java/com/lion/ai/web/|app/src/main/assets/|\.github/workflows/build\.yml)'; then
            run=true
          else
            run=false
          fi
        fi
        echo "browser tests needed: $run"
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - name: Fetch proot (Linux environment runtime, checksum-verified)
      run: bash scripts/fetch-proot.sh

    - name: Install npm dependencies
      run: npm --prefix scripts ci --ignore-scripts --prefer-offline --no-audit

    - name: Test browser session DOM bridge
      run: npm --prefix scripts test

    - name: Install Playwright Chromium (cached)
      if: steps.web.outputs.run == 'true'
      run: npm exec --prefix scripts -- playwright install --with-deps chromium

    - name: Test real Chromium editor and reply round trips (local fixtures)
      if: steps.web.outputs.run == 'true'
      run: npm --prefix scripts run test:browser

    # بوابة بيانات Lion-1: يمنع دمج بيانات تدريب قديمة أو صيغة أدوات مكسورة
    - name: Validate Lion-1 training data (tools catalog + JSONL format)
      run: |
        python model/data/import_tools.py --check
        python model/eval_lion.py data model/data/train.jsonl model/data/val.jsonl

    # تحليل ثابت يفشل على أي مخالفة جديدة (maxIssues: 0 في config/detekt/detekt.yml)
    - name: Static analysis (detekt)
      run: ./gradlew detekt --stacktrace

    - name: Run unit tests
      run: |
        set -o pipefail
        ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit-tests.log

    - name: Coverage report (Kover) + summary
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        ./gradlew koverXmlReport --stacktrace
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        r = ET.parse("app/build/reports/kover/report.xml").getroot()
        for c in r.iter("counter"):
            if c.get("type") == "LINE":
                m, cv = int(c.get("missed")), int(c.get("covered"))
                print(f"::notice::Line coverage: {cv / (m + cv) * 100:.1f}% ({cv}/{m + cv} lines)")
        PY

    - name: Report failing tests
      if: failure()
      run: |
        python3 - <<'PY'
        import glob
        import xml.etree.ElementTree as ET
        for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
            try:
                root = ET.parse(path).getroot()
            except Exception:
                continue
            for case in root.iter("testcase"):
                failure = case.find("failure")
                if failure is None:
                    continue
                message = (failure.get("message") or failure.text or "failed").replace("\n", " ")[:1200]
                print(f"::error file={path}::{case.get('classname')}.{case.get('name')}: {message}")
        PY
        grep -E "^(e: |.*error: )" /tmp/unit-tests.log | head -20 | while IFS= read -r line; do
          echo "::error::${line}"
        done

    - name: Build signed release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Report dex register pressure (giant methods break the ART verifier)
      continue-on-error: true
      run: python3 scripts/dex_registers.py app/build/outputs/apk/release/*.apk

    - name: Show signing certificate (must be identical on every build)
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-256|Signer #1" || true

    - name: Verify signing certificate fingerprint
      if: github.event_name != 'pull_request'
      env:
        EXPECTED_SHA256: ${{ vars.LION_CERT_SHA256 }}
      run: |
        APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
        ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk \
          | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
        EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-Z' 'a-z')
        echo "Actual certificate SHA-256: $ACTUAL"
        if [ -z "$EXPECTED" ]; then
          echo "::error::LION_CERT_SHA256 is not set; refusing to publish without a fingerprint check."
          exit 1
        fi
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::Signing certificate changed! Users could not update over the installed app."
          exit 1
        fi
        echo "Certificate matches the expected fingerprint."

    - name: Upload APK (signed release key, safe to install)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: LionAI-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload PR test APK (debug key - DO NOT INSTALL)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: PR-TEST-ONLY-DO-NOT-INSTALL
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 7

    - name: Upload detekt and coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-reports
        path: |
          build/reports/detekt/
          app/build/reports/kover/
        if-no-files-found: ignore
        retention-days: 14