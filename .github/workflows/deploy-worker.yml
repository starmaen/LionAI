name: Deploy LionAI Gateway Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Normalize Cloudflare credentials
      id: cf
      env:
        RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
        ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
        FP="token_len=${#TOKEN} account_len=${#ACCOUNT}"
        echo "credential fingerprint: $FP"
        if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
          echo "::error::$FP — أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID في GitHub → Settings → Secrets and variables → Actions"
          exit 1
        fi
        if [[ "$TOKEN" == cfk_* ]]; then
          echo "::error::$FP — القيمة المدخلة هي Global API Key (cfk_) وليست API Token. أنشئ User API Token من https://dash.cloudflare.com/profile/api-tokens بقالب Edit Cloudflare Workers"
          exit 1
        fi
        if [[ "$TOKEN" == AQ.* || "$TOKEN" == AIza* ]]; then
          echo "::error::$FP — هذه القيمة مفتاح Google/Gemini وليست توكن Cloudflare. ضع مفتاح Gemini في Cloudflare باسم GEMINI_API_KEY، وضع توكن Cloudflare (يبدأ بـ cfut_) هنا"
          exit 1
        fi
        if [[ ! "$TOKEN" =~ ^cfut_ && ! "$TOKEN" =~ ^cfat_ && ! "$TOKEN" =~ ^[A-Za-z0-9_-]{40}$ ]]; then
          echo "::error::$FP — صيغة CLOUDFLARE_API_TOKEN غير صحيحة. أنشئ User API Token من https://dash.cloudflare.com/profile/api-tokens بقالب Edit Cloudflare Workers"
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"

    - name: Deploy Worker
      working-directory: worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
      run: |
        set -o pipefail
        npx --yes wrangler@3 deploy 2>&1 | tee /tmp/deploy.log

    - name: Show deploy error
      if: failure()
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        emit() { echo "::error::$1"; }
        emit "token_len=${#CLOUDFLARE_API_TOKEN} account_len=${#CLOUDFLARE_ACCOUNT_ID}"
        V=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
        emit "verify=$(echo "$V" | tr -d '\n' | cut -c1-350)"
        A=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
        emit "account=$(echo "$A" | tr -d '\n' | cut -c1-350)"
        W=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/lionai-gateway")
        emit "worker=$(echo "$W" | tr -d '\n' | cut -c1-350)"
