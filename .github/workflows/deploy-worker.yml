name: Deploy LionAI Gateway Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Check Cloudflare credentials
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
          echo "::error::أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID في GitHub → Settings → Secrets and variables → Actions"
          exit 1
        fi

    - name: Deploy Worker
      working-directory: worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        set -o pipefail
        npx --yes wrangler@3 deploy 2>&1 | tee /tmp/deploy.log

    - name: Show deploy error
      if: failure()
      run: |
        echo "::group::wrangler whoami"
        (cd worker && CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" npx --yes wrangler@3 whoami 2>&1 || true) | tee -a /tmp/deploy.log
        echo "::endgroup::"
        tail -n 40 /tmp/deploy.log | while IFS= read -r line; do
          [ -n "$line" ] && echo "::error::$line"
        done
