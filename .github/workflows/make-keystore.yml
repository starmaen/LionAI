name: Generate Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate keystore
        run: |
          if [ -f keystore/lionai-release.jks ]; then
            echo "Keystore already exists, nothing to do."
            exit 0
          fi
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/lionai-release.jks \
            -alias lionai \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 'LionAI2026!Release' \
            -keypass 'LionAI2026!Release' \
            -dname "CN=Lion AI, OU=LionAI, O=LionAI, C=SA"
          keytool -list -v -keystore keystore/lionai-release.jks \
            -storepass 'LionAI2026!Release' | grep -E "Alias|SHA256|Valid"

      - name: Commit keystore
        run: |
          if git diff --quiet -- keystore/lionai-release.jks 2>/dev/null && git ls-files --error-unmatch keystore/lionai-release.jks >/dev/null 2>&1; then
            echo "Keystore already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/lionai-release.jks
          git commit -m "Add stable release signing keystore"
          git push
